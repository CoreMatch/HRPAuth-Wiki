name: Publish wiki to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # VitePress lastUpdated needs the full git history
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .vitepress/package-lock.json

      - name: Install dependencies
        working-directory: .vitepress
        run: npm ci

      # Rollup resolves imports upward from each content file; the content
      # lives at the repository root while node_modules lives in
      # .vitepress/, so expose it at the root for resolution (the symlink
      # is not part of the uploaded artifact).
      - name: Expose dependencies to content root
        run: ln -s .vitepress/node_modules node_modules

      # Rendering layer over the plain Markdown at the repository root
      # (knowledge/0006): the build reads srcDir '..' and writes
      # .vitepress/dist. The Markdown files are the only content source.
      - name: Build site
        working-directory: .vitepress
        run: npm run build

      - name: Verify build output
        run: test -f .vitepress/dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
